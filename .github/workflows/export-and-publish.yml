name: Export Notion & Publish

on:
  schedule:
    # Daily at 06:00 UTC. Adjust or remove as needed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "content/**"  # avoid loops from the export commit
      - "data/**"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # commit exported Markdown back to the repo
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Notion dashboards
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # Optional: override the per-dashboard page ids baked into the script.
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_FUNDAMENTAL_PAGE_ID: ${{ secrets.NOTION_FUNDAMENTAL_PAGE_ID }}
        run: python scripts/export_notion.py

      - name: Commit exported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content data
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: export Notion database [skip ci]"
            git push
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.148.0"
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
