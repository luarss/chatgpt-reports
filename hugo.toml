# Hugo configuration. baseURL is overridden in CI for GitHub Pages.
baseURL = "https://luarss.github.io/chatgpt-reports/"
languageCode = "en-us"
title = "Research Dashboards"
theme = "PaperMod"

# Pagination for the reports list.
[pagination]
  pagerSize = 20

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  # Landing shows the list of reports directly.
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

# The home page is a generic hub (content/_index.md) rendered via
# layouts/index.html; each dashboard lives under its own /<slug>/ section, with
# per-dashboard sub-section links rendered inside that dashboard's home page.
# Keep the top menu to Home + one entry per dashboard.

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 5

[[menu.main]]
  identifier = "ai-bubble"
  name = "AI Bubble"
  url = "/ai-bubble/"
  weight = 10

[[menu.main]]
  identifier = "fundamental"
  name = "Fundamental Screen"
  url = "/fundamental/"
  weight = 20

[markup.goldmark.renderer]
  # Notion export may include raw HTML (e.g. embeds); allow it through.
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
